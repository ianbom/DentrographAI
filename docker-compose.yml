services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      laravel-nginx:
        condition: service_started
      fastapi:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public

  laravel-app:
    build:
      context: .
      dockerfile: dentograph-web/Dockerfile
      target: app
    restart: unless-stopped
    env_file:
      - ./.env.docker
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - laravel_storage:/var/www/html/storage
      - laravel_cache:/var/www/html/bootstrap/cache
    networks:
      - public
      - backend

  laravel-nginx:
    build:
      context: .
      dockerfile: dentograph-web/Dockerfile
      target: nginx
    restart: unless-stopped
    depends_on:
      laravel-app:
        condition: service_started
    volumes:
      - laravel_storage:/var/www/html/storage:ro
    networks:
      - public

  laravel-worker:
    build:
      context: .
      dockerfile: dentograph-web/Dockerfile
      target: app
    restart: unless-stopped
    env_file:
      - ./.env.docker
    depends_on:
      mariadb:
        condition: service_healthy
      fastapi:
        condition: service_started
    command: ["php", "artisan", "queue:work", "database", "--sleep=3", "--tries=3", "--max-time=3600"]
    volumes:
      - laravel_storage:/var/www/html/storage
      - laravel_cache:/var/www/html/bootstrap/cache
    networks:
      - public
      - backend

  fastapi:
    build:
      context: .
      dockerfile: dentograph-yolo/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.fastapi.docker
    depends_on:
      mariadb:
        condition: service_healthy
      ollama-proxy:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - laravel_storage:/var/www/html/storage
      - ./dentograph-yolo/models:/app/models:ro
    expose:
      - "8001"
    networks:
      - public
      - backend

  ollama-proxy:
    image: alpine/socat:latest
    restart: unless-stopped
    network_mode: host
    command: TCP-LISTEN:11435,fork,reuseaddr,bind=0.0.0.0 TCP:127.0.0.1:11434

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dentograph}
      MYSQL_USER: ${MYSQL_USER:-dentograph_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend

networks:
  public:
  backend:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  laravel_storage:
  laravel_cache:
  mariadb_data:
